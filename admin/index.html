<body class="adm-page">
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="site-header">
<div class="wrap">
<a class="brand" href="../"><img src="../assets/logo.webp" width="44" height="44" alt=""><span><b>그루터기</b><small>관리자 화면</small></span></a>
<div class="tools" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<span id="who" class="who"></span>
<button class="btn-line btn-theme" id="theme" type="button">화면: 자동</button>
<button class="btn-line" id="logout" type="button" hidden>로그아웃</button>
</div>
</div>
</header>
<main id="main" class="wrap">

<section class="member-box" id="login">
<h1 class="h2" style="font-size:28px">관리자 로그인</h1>
<p class="muted">관리자로 등록된 Google 계정으로 로그인한 뒤, 6자리 PIN을 한 번 더 입력합니다. 앱을 다시 열거나 일정 시간 움직임이 없으면 PIN을 다시 묻습니다.</p>
<button class="btn btn-primary" id="google" type="button">Google 계정으로 로그인</button>
<p class="msg" id="login-msg" role="status" hidden></p>
</section>

<section class="member-box" id="pin" hidden>
<h1 class="h2" style="font-size:26px" id="pin-title">PIN 입력</h1>
<p class="muted" id="pin-help">관리자 PIN 6자리를 입력하세요.</p>
<form id="pin-form" class="stack" style="gap:12px" autocomplete="off">
<label for="pin1">PIN 6자리</label>
<input id="pin1" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="off" required>
<div id="pin2-wrap" hidden><label for="pin2">한 번 더 입력</label>
<input id="pin2" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="off"></div>
<button class="btn btn-primary" type="submit" id="pin-go">확인</button>
</form>
<p class="msg" id="pin-msg" role="status" hidden></p>
<p class="sub"><button type="button" class="linklike" id="pin-mode">처음이신가요? PIN 만들기</button> · <button type="button" class="linklike" id="pin-out">다른 계정으로 로그인</button></p>
</section>

<section class="member-box" id="denied" hidden>
<h1 class="h2" style="font-size:26px">관리자 권한이 없습니다</h1>
<p class="muted">이 계정은 아직 관리자로 등록되지 않았습니다. 처음 설정하는 경우 아래 사용자 번호(UID)를 파이어베이스 콘솔의 admins 목록에 등록하세요.</p>
<p class="code" id="denied-uid"></p>
</section>

<div class="adm" id="app" hidden>
<nav class="adm-side" role="tablist" aria-label="관리 메뉴">
<button role="tab" data-tab="dash" aria-selected="true">대시보드</button>
<button role="tab" data-tab="stats" aria-selected="false">방문 통계</button>
<button role="tab" data-tab="home" aria-selected="false">홈 화면</button>
<button role="tab" data-tab="notices" aria-selected="false">공고</button>
<button role="tab" data-tab="inq" aria-selected="false">문의 <span class="badge" id="inq-badge" hidden></span></button>
<button role="tab" data-tab="members" aria-selected="false">조합원</button>
<button role="tab" data-tab="sec" aria-selected="false">보안 · 기록</button>
</nav>
<div class="adm-main" id="view" aria-live="polite"></div>
</div>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="admin.js?v=13"></script>
<script type="module" src="../js/track.js"></script>

</html>
