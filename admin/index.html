<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com; frame-src https://grutergi-coop.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#1F5C3D">
<meta name="robots" content="noindex, nofollow">
<title>관리자 · 그루터기 사회적협동조합</title>
<link rel="icon" href="../assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="site-header">
<div class="wrap">
<a class="brand" href="../"><img src="../assets/logo.webp" width="44" height="44" alt=""><span><b>그루터기</b><small>관리자 화면</small></span></a>
<div class="tools" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<span id="who" class="muted" style="font-size:14px"></span>
<button class="btn-line" id="logout" type="button" hidden>로그아웃</button>
</div>
</div>
</header>
<main id="main" class="wrap">

<section class="member-box" id="login">
<h1 class="h2" style="font-size:28px">관리자 로그인</h1>
<p class="muted">관리자 이메일로 로그인 링크를 받습니다. 브라우저를 닫거나 일정 시간 움직임이 없으면 자동으로 로그아웃됩니다.</p>
<form id="login-form" class="stack" style="gap:12px">
<label for="email">관리자 이메일</label>
<input id="email" name="email" type="email" autocomplete="email" required>
<button class="btn btn-primary" type="submit">로그인 링크 받기</button>
</form>
<p class="msg" id="login-msg" role="status" hidden></p>
</section>

<section class="member-box" id="denied" hidden>
<h1 class="h2" style="font-size:26px">관리자 권한이 없습니다</h1>
<p class="muted">이 계정은 아직 관리자로 등록되지 않았습니다. 처음 설정하는 경우 아래 사용자 번호(UID)를 파이어베이스 콘솔의 admins 목록에 등록하세요.</p>
<p class="code" id="denied-uid"></p>
</section>

<div class="adm" id="app" hidden>
<nav class="adm-side" role="tablist" aria-label="관리 메뉴">
<button role="tab" data-tab="dash" aria-selected="true">대시보드</button>
<button role="tab" data-tab="home" aria-selected="false">홈 화면</button>
<button role="tab" data-tab="notices" aria-selected="false">공고</button>
<button role="tab" data-tab="inq" aria-selected="false">문의 <span class="badge" id="inq-badge" hidden></span></button>
<button role="tab" data-tab="members" aria-selected="false">조합원</button>
<button role="tab" data-tab="sec" aria-selected="false">보안 · 기록</button>
</nav>
<div class="adm-main" id="view" aria-live="polite"></div>
</div>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="admin.js?v=6"></script>
<script type="module" src="../js/track.js"></script>
</body>
</html>
