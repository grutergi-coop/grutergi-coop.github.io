<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>조합원 · 그루터기 사회적협동조합</title>
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="site-header">
<div class="wrap">
<a class="brand" href="../"><img src="../assets/logo.svg" width="40" height="40" alt=""><span><b>그루터기</b><small>사회적협동조합</small></span></a>
<nav class="nav" aria-label="주 메뉴">
<a href="../#about">조합 소개</a>
<a href="../notice/">공고·공시</a>
</nav>
<button class="btn-line" id="logout" type="button" hidden>로그아웃</button>
</div>
</header>
<main id="main" class="wrap">
<section class="member-box" id="login">
<h1 style="font-family:var(--f-head);font-size:28px">조합원 로그인</h1>
<p style="color:var(--muted)">조합에 등록한 이메일을 적으면 로그인 링크를 보내 드립니다. 비밀번호는 없습니다.</p>
<form id="login-form" style="display:flex;flex-direction:column;gap:12px">
<label for="email">이메일</label>
<input id="email" name="email" type="email" autocomplete="email" required>
<button class="btn btn-primary" type="submit">로그인 링크 받기</button>
</form>
<p class="msg" id="login-msg" role="status" hidden></p>
</section>
<section id="pending" class="member-box" hidden>
<h1 style="font-family:var(--f-head);font-size:26px">승인을 기다리고 있습니다</h1>
<p style="color:var(--muted)"><span id="pending-email"></span> 주소로 로그인했습니다. 조합 사무국이 조합원 명부와 확인한 뒤 열람 권한을 드립니다.</p>
</section>
<section id="dash" class="section" hidden>
<div class="section-head">
<h1 style="font-family:var(--f-head);font-size:clamp(26px,3.4vw,36px)"><span id="member-name"></span> 조합원님</h1>
<p id="member-type" style="color:var(--muted)"></p>
</div>
<div class="dash">
<div class="card"><b>총회 · 이사회 자료</b><ul id="meetings" style="margin:0;padding-left:18px;color:var(--muted)"><li>불러오는 중</li></ul></div>
<div class="card"><b>내 출자</b><p id="share">불러오는 중</p></div>
<div class="card"><b>참여 당번</b><p style="color:var(--muted)">당번 캘린더는 어린이집 개원 준비와 함께 열립니다.</p></div>
</div>
</section>
</main>
<script type="module" src="../js/member.js"></script>
</body>
</html>
